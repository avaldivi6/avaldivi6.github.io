# _config.yml
title: "Placeholder Name"
description: "Teaching-centered faculty site (placeholder content)"
url: "https://avaldivi6.github.io" # your GitHub Pages url
baseurl: "" # keep empty for username.github.io

# Use Minimal Mistakes remote theme so GitHub Pages builds without plugins
remote_theme: mmistakes/minimal-mistakes

# Basic site/author info (update later)
author:
  name: "Placeholder Name"
  email: ""

# Navigation
nav:
  - title: "Home"
    url: /
  - title: "Teaching"
    url: /teaching/
  - title: "Research"
    url: /research/
  - title: "Publications"
    url: /publications/
  - title: "Contact"
    url: /contact/

# Minimal Mistakes config examples (optional customizations)
logo:
  path: /assets/images/headshot.jpg
  text: "Placeholder Name"

# Keep plugins empty for GitHub Pages native build
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme # If you are using the remote_theme option
markdown: kramdown
kramdown:
  input: GFM
