# _config.yml (minimal, safe for GitHub Pages with remote_theme)
title: "Arturo Valdivia's Website"
description: "Teaching-centered faculty site (placeholder)."
url: "https://avaldivi6.github.io"
baseurl: ""

remote_theme: mmistakes/minimal-mistakes

author:
  name: "Arturo Valdivia"
  email: "artvaldi@iu.edu"

# top nav
nav:
  - title: "Home"
    url: /
  - title: "Teaching"
    url: /teaching/
  - title: "Research"
    url: /research/
  - title: "Publications"
    url: /publications/
  - title: "Contact"
    url: /contact/

logo:
  path: /assets/images/headshot.jpg
  text: "Arturo Valdivia"

# Keep plugins empty for native GitHub Pages builds
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Markdown
markdown: kramdown
kramdown:
  input: GFM
