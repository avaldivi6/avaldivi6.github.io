# _config.yml (minimal, safe for GitHub Pages with remote_theme)
title: "Arturo Valdivia"
description: "Teaching-centered faculty site (placeholder)."
url: "https://avaldivi6.github.io"
baseurl: ""

remote_theme: mmistakes/minimal-mistakes

# Keep plugins empty for native GitHub Pages builds
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jemoji
  - jekyll-include-cache

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax

# Reading Files
include:
  - _pages
  - _courses
  - _data
  - assets


defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
      classes: "wide"

footer:
  disable_feed: true
